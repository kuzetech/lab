services:
  mysql:
    image: mysql:8.0
    container_name: quickly-start-mysql
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 768m
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: app_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/conf.d:/etc/mysql/conf.d:ro
      - ./mysql/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mysql-init:
    image: mysql:8.0
    container_name: quickly-start-mysql-init
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      TZ: Asia/Shanghai
    volumes:
      - ./mysql/initdb:/docker-entrypoint-initdb.d:ro
    command:
      - /bin/bash
      - -c
      - |
        mysql --default-character-set=utf8mb4 -hmysql -uroot -p"$${MYSQL_ROOT_PASSWORD}" app_db < /docker-entrypoint-initdb.d/001-init.sql

  kafka:
    image: apache/kafka:3.9.2
    container_name: quickly-start-kafka
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 768m
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      TZ: Asia/Shanghai
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  hive-metastore:
    image: apache/hive:3.1.3
    platform: linux/amd64
    container_name: quickly-start-hive-metastore
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 768m
    depends_on:
      mysql-init:
        condition: service_completed_successfully
    ports:
      - "9083:9083"
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: mysql
      METASTORE_PORT: 9083
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=com.mysql.cj.jdbc.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:mysql://mysql:3306/hive_metastore?createDatabaseIfNotExist=false&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=hive_password
      TZ: Asia/Shanghai
    entrypoint:
      - /bin/bash
      - -c
      - |
        if HADOOP_CLIENT_OPTS="$${HADOOP_CLIENT_OPTS} -Xmx512m $${SERVICE_OPTS}" /opt/hive/bin/schematool -dbType "$${DB_DRIVER}" -info >/dev/null 2>&1; then
          export IS_RESUME=true
        fi
        export HIVE_CONF_DIR=/opt/hive/conf
        export HADOOP_CLIENT_OPTS="$${HADOOP_CLIENT_OPTS} -Xmx512m $${SERVICE_OPTS}"
        if [ "$${IS_RESUME:-false}" != "true" ]; then
          /opt/hive/bin/schematool -dbType "$${DB_DRIVER}" -initSchema
        fi
        export METASTORE_PORT="$${METASTORE_PORT:-9083}"
        exec /opt/hive/bin/hive --skiphadoopversion --skiphbasecp --service metastore
    volumes:
      - ${MYSQL_CONNECTOR_JAR:-./mysql/jar/mysql-connector-j-8.0.33.jar}:/opt/hive/lib/mysql-connector-j-8.0.33.jar:ro
      - hive-warehouse:/opt/hive/data/warehouse
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "timeout 5 bash -c '</dev/tcp/127.0.0.1/9083'"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  namenode:
    image: apache/hadoop:3.3.6
    container_name: namenode
    hostname: namenode
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 512m
    user: root
    command:
      - /bin/bash
      - -c
      - |
        mkdir -p /tmp/hadoop-root/dfs/name
        chown -R hadoop:hadoop /tmp/hadoop-root/dfs/name
        if [ ! -d /tmp/hadoop-root/dfs/name/current ]; then
          su -s /bin/bash hadoop -c 'hdfs namenode -format -force -nonInteractive'
        fi
        exec su -s /bin/bash hadoop -c 'hdfs namenode'
    ports:
      - "9870:9870"
      - "9000:9000"
    volumes:
      - namenode_data:/tmp/hadoop-root/dfs/name
      - ./hadoop/conf/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hadoop/conf/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - ./hadoop/conf/yarn-site.xml:/opt/hadoop/etc/hadoop/yarn-site.xml:ro
      - ./hadoop/conf/mapred-site.xml:/opt/hadoop/etc/hadoop/mapred-site.xml:ro
    environment:
      ENSURE_NAMENODE_DIR: /tmp/hadoop-root/dfs/name
      HDFS_NAMENODE_OPTS: -Xmx384m

  datanode:
    image: apache/hadoop:3.3.6
    container_name: datanode
    hostname: datanode
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 512m
    user: root
    command:
      - /bin/bash
      - -c
      - |
        mkdir -p /tmp/hadoop-root/dfs/data
        chown -R hadoop:hadoop /tmp/hadoop-root/dfs/data
        exec su -s /bin/bash hadoop -c 'hdfs datanode'
    ports:
      - "9864:9864"
    volumes:
      - datanode_data:/tmp/hadoop-root/dfs/data
      - ./hadoop/conf/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hadoop/conf/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - ./hadoop/conf/yarn-site.xml:/opt/hadoop/etc/hadoop/yarn-site.xml:ro
      - ./hadoop/conf/mapred-site.xml:/opt/hadoop/etc/hadoop/mapred-site.xml:ro
    environment:
      HDFS_DATANODE_OPTS: -Xmx256m
    depends_on:
      - namenode

  resourcemanager:
    image: apache/hadoop:3.3.6
    container_name: resourcemanager
    hostname: resourcemanager
    restart: unless-stopped
    cpus: 1
    mem_limit: 768m
    command: ["yarn", "resourcemanager"]
    ports:
      - "8088:8088"
    volumes:
      - ./hadoop/conf/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hadoop/conf/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - ./hadoop/conf/yarn-site.xml:/opt/hadoop/etc/hadoop/yarn-site.xml:ro
      - ./hadoop/conf/mapred-site.xml:/opt/hadoop/etc/hadoop/mapred-site.xml:ro
      - ./hadoop/conf/capacity-scheduler.xml:/opt/hadoop/etc/hadoop/capacity-scheduler.xml:ro
    environment:
      YARN_RESOURCEMANAGER_OPTS: -Xmx512m
    depends_on:
      - namenode
      - datanode

  nodemanager:
    image: apache/hadoop:3.3.6
    container_name: nodemanager
    hostname: nodemanager
    restart: unless-stopped
    mem_limit: 4g
    command: ["yarn", "nodemanager"]
    ports:
      - "8042:8042"
    volumes:
      - ./hadoop/conf/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hadoop/conf/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - ./hadoop/conf/yarn-site.xml:/opt/hadoop/etc/hadoop/yarn-site.xml:ro
      - ./hadoop/conf/mapred-site.xml:/opt/hadoop/etc/hadoop/mapred-site.xml:ro
    environment:
      YARN_NODEMANAGER_OPTS: -Xmx512m
    depends_on:
      - namenode
      - datanode
      - resourcemanager

  dolphinscheduler:
    image: dolphinscheduler-flink:3.4.2
    container_name: quickly-start-dolphinscheduler
    restart: unless-stopped
    cpus: 2
    mem_limit: 1g
    ports:
      - "12345:12345"
      - "25333:25333"
    environment:
      TZ: Asia/Shanghai
      HADOOP_HOME: /opt/hadoop-3.2.1
      HADOOP_CONF_DIR: /etc/hadoop
      YARN_CONF_DIR: /etc/hadoop
      FLINK_HOME: /opt/flink
      BASH_ENV: /etc/profile.d/dolphinscheduler-default.sh
      JAVA_OPTS: >-
        -server
        -Xms512m
        -Xmx1024m
        -Xmn256m
        -XX:+IgnoreUnrecognizedVMOptions
        -XX:+PrintGCDateStamps
        -XX:+PrintGCDetails
        -Xloggc:gc-%t.log
        -XX:ErrorFile=java_error-%p.log
        -XX:-OmitStackTraceInFastThrow
        -XX:+ExitOnOutOfMemoryError
        -XX:+HeapDumpOnOutOfMemoryError
        -XX:HeapDumpPath=dump.hprof
        -DDOCKER=true
      DATABASE: mysql
      SPRING_PROFILES_ACTIVE: mysql
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/dolphinscheduler?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: dolphinscheduler
      SPRING_DATASOURCE_PASSWORD: dolphinscheduler_password
      MASTER_SERVER_LOAD_PROTECTION_ENABLED: "false"
      WORKER_SERVER_LOAD_PROTECTION_ENABLED: "false"
    command:
      - /bin/bash
      - -c
      - |
        source /etc/profile.d/dolphinscheduler-default.sh
        /bin/bash /opt/dolphinscheduler/tools/bin/upgrade-schema.sh
        exec tail -f /dev/null
    volumes:
      - ./hadoop/conf/core-site.xml:/etc/hadoop/core-site.xml:ro
      - ./hadoop/conf/hdfs-site.xml:/etc/hadoop/hdfs-site.xml:ro
      - ./hadoop/conf/yarn-site.xml:/etc/hadoop/yarn-site.xml:ro
      - ./hadoop/conf/mapred-site.xml:/etc/hadoop/mapred-site.xml:ro
      - ./hadoop/conf/hive-site.xml:/etc/hive/hive-site.xml:ro
      - ./dolphinscheduler/env/default.sh:/etc/profile.d/dolphinscheduler-default.sh:ro
      - ./dolphinscheduler/jobs:/opt/jobs
      - ./flink/flink-conf.yaml:/opt/flink/conf/flink-conf.yaml
      - ./flink/sql-client-init:/opt/flink/conf/sql-init
    depends_on:
      mysql-init:
        condition: service_completed_successfully
      namenode:
        condition: service_started
      datanode:
        condition: service_started
      resourcemanager:
        condition: service_started
      nodemanager:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "timeout 5 bash -c '</dev/tcp/127.0.0.1/12345'"
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s

volumes:
  mysql-data:
  kafka-data:
  hive-warehouse:
  namenode_data:
  datanode_data:

networks:
  default:
    name: quickly-start-network
