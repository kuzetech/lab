services:
  mysql:
    image: mysql:8.0
    container_name: quickly-start-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: app_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/conf.d:/etc/mysql/conf.d:ro
      - ./mysql/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  kafka:
    image: apache/kafka:3.9.2
    container_name: quickly-start-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      TZ: Asia/Shanghai
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  hive-metastore:
    image: apache/hive:3.1.3
    platform: linux/amd64
    container_name: quickly-start-hive-metastore
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "9083:9083"
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: mysql
      METASTORE_PORT: 9083
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=com.mysql.cj.jdbc.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:mysql://mysql:3306/hive_metastore?createDatabaseIfNotExist=false&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=hive_password
      TZ: Asia/Shanghai
    entrypoint:
      - /bin/bash
      - -c
      - |
        if HADOOP_CLIENT_OPTS="$${HADOOP_CLIENT_OPTS} -Xmx1G $${SERVICE_OPTS}" /opt/hive/bin/schematool -dbType "$${DB_DRIVER}" -info >/dev/null 2>&1; then
          export IS_RESUME=true
        fi
        exec /entrypoint.sh
    volumes:
      - ${MYSQL_CONNECTOR_JAR:-./hive/jar/mysql-connector-j-8.0.33.jar}:/opt/hive/lib/mysql-connector-j-8.0.33.jar:ro
      - hive-warehouse:/opt/hive/data/warehouse

  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    restart: unless-stopped
    ports:
      - "9870:9870"
      - "9000:9000"
    volumes:
      - namenode_data:/hadoop/dfs/name
    environment:
      CLUSTER_NAME: single-node
    env_file:
      - ./hadoop/hadoop.env

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode
    hostname: datanode
    restart: unless-stopped
    ports:
      - "9864:9864"
    volumes:
      - datanode_data:/hadoop/dfs/data
    environment:
      SERVICE_PRECONDITION: "namenode:9870"
    env_file:
      - ./hadoop/hadoop.env
    depends_on:
      - namenode

  resourcemanager:
    image: bde2020/hadoop-resourcemanager:2.0.0-hadoop3.2.1-java8
    container_name: resourcemanager
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      SERVICE_PRECONDITION: "namenode:9000 namenode:9870 datanode:9864"
    env_file:
      - ./hadoop/hadoop.env
    depends_on:
      - namenode
      - datanode

  nodemanager:
    image: bde2020/hadoop-nodemanager:2.0.0-hadoop3.2.1-java8
    container_name: nodemanager
    hostname: nodemanager
    restart: unless-stopped
    ports:
      - "8042:8042"
    environment:
      SERVICE_PRECONDITION: "namenode:9000 namenode:9870 datanode:9864 resourcemanager:8088"
    env_file:
      - ./hadoop/hadoop.env
    depends_on:
      - namenode
      - datanode
      - resourcemanager

  dolphinscheduler:
    image: dolphinscheduler-flink:3.4.2
    container_name: quickly-start-dolphinscheduler
    restart: unless-stopped
    ports:
      - "12345:12345"
      - "25333:25333"
    environment:
      TZ: Asia/Shanghai
      HADOOP_HOME: /opt/hadoop-3.2.1
      HADOOP_CONF_DIR: /etc/hadoop
      YARN_CONF_DIR: /etc/hadoop
      FLINK_HOME: /opt/flink
      DATABASE: mysql
      SPRING_PROFILES_ACTIVE: mysql
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/dolphinscheduler?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: dolphinscheduler
      SPRING_DATASOURCE_PASSWORD: dolphinscheduler_password
      MASTER_SERVER_LOAD_PROTECTION_ENABLED: "false"
      WORKER_SERVER_LOAD_PROTECTION_ENABLED: "false"
    command:
      - /bin/bash
      - -c
      - |
        /bin/bash /opt/dolphinscheduler/tools/bin/upgrade-schema.sh
        exec /bin/bash /opt/dolphinscheduler/standalone-server/bin/start.sh
    volumes:
      - ./hadoop/conf/core-site.xml:/etc/hadoop/core-site.xml:ro
      - ./hadoop/conf/hdfs-site.xml:/etc/hadoop/hdfs-site.xml:ro
      - ./hadoop/conf/yarn-site.xml:/etc/hadoop/yarn-site.xml:ro
      - ./hadoop/conf/mapred-site.xml:/etc/hadoop/mapred-site.xml:ro
      - ./hive/conf/hive-site.xml:/etc/hive/hive-site.xml:ro
      - ./dolphinscheduler/jobs:/opt/jobs
      - ./flink/flink-conf.yaml:/opt/flink/conf/flink-conf.yaml
      - ./flink/sql-client-init:/opt/flink/conf/sql-init
    depends_on:
      mysql:
        condition: service_healthy
      namenode:
        condition: service_started
      datanode:
        condition: service_started
      resourcemanager:
        condition: service_started
      nodemanager:
        condition: service_started

volumes:
  mysql-data:
  kafka-data:
  hive-warehouse:
  namenode_data:
  datanode_data:

networks:
  default:
    name: quickly-start-network
