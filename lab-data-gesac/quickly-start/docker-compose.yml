services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.0}
    container_name: ${MYSQL_CONTAINER_NAME:-quickly-start-mysql}
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app_db}
      MYSQL_USER: ${MYSQL_USER:-app_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app_password}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      - ./conf.d:/etc/mysql/conf.d:ro
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  kafka:
    image: ${KAFKA_IMAGE:-apache/kafka:3.9.2}
    container_name: ${KAFKA_CONTAINER_NAME:-quickly-start-kafka}
    restart: unless-stopped
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-4L6g3nShT-eMCtK--X86sw}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:${KAFKA_CONTROLLER_PORT:-9093}
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:${KAFKA_INTERNAL_PORT:-29092},CONTROLLER://:${KAFKA_CONTROLLER_PORT:-9093}
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${KAFKA_HOST_PORT:-9092},INTERNAL://kafka:${KAFKA_INTERNAL_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      TZ: Asia/Shanghai
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  doris:
    image: ${DORIS_IMAGE:-yagagagaga/doris-standalone:4.1.0}
    container_name: ${DORIS_CONTAINER_NAME:-quickly-start-doris}
    restart: unless-stopped
    ports:
      - "${DORIS_FE_HTTP_PORT:-8030}:8030"
      - "${DORIS_FE_QUERY_PORT:-9030}:9030"
      - "${DORIS_BE_HTTP_PORT:-8040}:8040"
      - "${DORIS_BE_HEARTBEAT_PORT:-9050}:9050"
      - "${DORIS_BE_BRPC_PORT:-8060}:8060"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - doris-data:/opt/apache-doris
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:8030/api/bootstrap >/dev/null || curl -fsS http://127.0.0.1:8030 >/dev/null"
        ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  flink-jobmanager:
    image: ${FLINK_IMAGE:-flink:1.20.3-scala_2.12-java8}
    container_name: ${FLINK_JOBMANAGER_CONTAINER_NAME:-quickly-start-flink-jobmanager}
    restart: unless-stopped
    command: jobmanager
    ports:
      - "${FLINK_WEB_PORT:-8081}:8081"
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        rest.address: 0.0.0.0
        rest.bind-address: 0.0.0.0
        parallelism.default: 2
      TZ: Asia/Shanghai
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "flink list >/dev/null 2>&1"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  flink-taskmanager-1:
    image: ${FLINK_IMAGE:-flink:1.20.3-scala_2.12-java8}
    container_name: ${FLINK_TASKMANAGER_1_CONTAINER_NAME:-quickly-start-flink-taskmanager-1}
    restart: unless-stopped
    command: taskmanager
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    cpus: 2.0
    mem_limit: 2g
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
        taskmanager.memory.process.size: 2g
      TZ: Asia/Shanghai

  dolphinscheduler:
    image: ${DOLPHINSCHEDULER_IMAGE:-apache/dolphinscheduler-standalone-server:3.4.2}
    container_name: ${DOLPHINSCHEDULER_CONTAINER_NAME:-quickly-start-dolphinscheduler}
    restart: unless-stopped
    ports:
      - "${DOLPHINSCHEDULER_API_PORT:-12345}:12345"
    environment:
      TZ: Asia/Shanghai

volumes:
  mysql-data:
  kafka-data:
  doris-data:
