services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: cdc
      POSTGRES_USER: flink
      POSTGRES_PASSWORD: flink
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=10", "-c", "max_wal_senders=10"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flink -d cdc"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - ./e2e/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

  jobmanager:
    image: flink:1.20.3-scala_2.12-java11
    command: jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        parallelism.default: 1
    ports:
      - "8081:8081"
    volumes:
      - ./output/flink-sql-connector-postgres-cdc-3.7-SNAPSHOT.jar:/opt/flink/lib/flink-sql-connector-postgres-cdc-3.7-SNAPSHOT.jar:ro

  taskmanager:
    image: flink:1.20.3-scala_2.12-java11
    command: taskmanager
    depends_on:
      postgres:
        condition: service_healthy
      jobmanager:
        condition: service_started
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 2
        parallelism.default: 1
    volumes:
      - ./output/flink-sql-connector-postgres-cdc-3.7-SNAPSHOT.jar:/opt/flink/lib/flink-sql-connector-postgres-cdc-3.7-SNAPSHOT.jar:ro

  sql-client:
    image: flink:1.20.3-scala_2.12-java11
    command: >-
      bash -c '/opt/flink/bin/sql-client.sh embedded
      -D execution.target=remote
      -D rest.address=jobmanager
      -D rest.port=8081
      -D execution.attached=false
      -f /opt/flink/e2e/job.sql'
    depends_on:
      postgres:
        condition: service_healthy
      jobmanager:
        condition: service_started
      taskmanager:
        condition: service_started
    volumes:
      - ./output/flink-sql-connector-postgres-cdc-3.7-SNAPSHOT.jar:/opt/flink/lib/flink-sql-connector-postgres-cdc-3.7-SNAPSHOT.jar:ro
      - ./e2e/job.sql:/opt/flink/e2e/job.sql:ro
