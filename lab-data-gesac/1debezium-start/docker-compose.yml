services:
  mysql:
    image: mysql:8.0
    container_name: quickly-start-mysql
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 768m
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: app_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/conf.d:/etc/mysql/conf.d:ro
      - ./mysql/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mysql-init:
    image: mysql:8.0
    container_name: quickly-start-mysql-init
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      TZ: Asia/Shanghai
    volumes:
      - ./mysql/initdb:/docker-entrypoint-initdb.d:ro
    command:
      - /bin/bash
      - -c
      - |
        mysql --default-character-set=utf8mb4 -hmysql -uroot -p"$${MYSQL_ROOT_PASSWORD}" app_db < /docker-entrypoint-initdb.d/001-init.sql

  kafka:
    image: apache/kafka:3.9.2
    container_name: quickly-start-kafka
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 768m
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      TZ: Asia/Shanghai
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  hive-metastore:
    image: apache/hive:3.1.3
    platform: linux/amd64
    container_name: quickly-start-hive-metastore
    restart: unless-stopped
    cpus: 1
    mem_limit: 768m
    depends_on:
      mysql-init:
        condition: service_completed_successfully
    ports:
      - "9083:9083"
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: mysql
      METASTORE_PORT: 9083
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=com.mysql.cj.jdbc.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:mysql://mysql:3306/hive_metastore?createDatabaseIfNotExist=false&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=hive_password
      TZ: Asia/Shanghai
    entrypoint:
      - /bin/bash
      - -c
      - |
        if HADOOP_CLIENT_OPTS="$${HADOOP_CLIENT_OPTS} -Xmx512m $${SERVICE_OPTS}" /opt/hive/bin/schematool -dbType "$${DB_DRIVER}" -info >/dev/null 2>&1; then
          export IS_RESUME=true
        fi
        export HIVE_CONF_DIR=/opt/hive/conf
        export HADOOP_CLIENT_OPTS="$${HADOOP_CLIENT_OPTS} -Xmx512m $${SERVICE_OPTS}"
        if [ "$${IS_RESUME:-false}" != "true" ]; then
          /opt/hive/bin/schematool -dbType "$${DB_DRIVER}" -initSchema
        fi
        export METASTORE_PORT="$${METASTORE_PORT:-9083}"
        exec /opt/hive/bin/hive --skiphadoopversion --skiphbasecp --service metastore
    volumes:
      - ./mysql/dep/mysql-connector-j-8.0.33.jar:/opt/hive/lib/mysql-connector-j-8.0.33.jar:ro
      - hive-warehouse:/opt/hive/data/warehouse
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "timeout 5 bash -c '</dev/tcp/127.0.0.1/9083'"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  debezium:
    image: quay.io/debezium/connect:3.7
    container_name: quickly-start-debezium
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      GROUP_ID: 1
      BOOTSTRAP_SERVERS: kafka:29092
      CONFIG_STORAGE_TOPIC: my_connect_configs
      OFFSET_STORAGE_TOPIC: my_connect_offsets
      STATUS_STORAGE_TOPIC: my_connect_statuses
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:8083/connectors >/dev/null"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  connect-init:
    image: curlimages/curl:8.10.1
    container_name: quickly-start-connect-init
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      debezium:
        condition: service_healthy
    volumes:
      - ./connect/mysql.json:/connectors/mysql.json:ro
    command:
      - /bin/sh
      - -c
      - |
        curl -fsS -X DELETE http://debezium:8083/connectors/inventory-connector || true
        curl -fsS \
          -H 'Content-Type: application/json' \
          -X POST \
          --data @/connectors/mysql.json \
          http://debezium:8083/connectors

volumes:
  mysql-data:
  kafka-data:
  hive-warehouse:

networks:
  default:
    name: debezium-start-network
