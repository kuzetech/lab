services:
  master:
    image: apache/seatunnel:2.3.13
    container_name: seatunnel_master
    restart: unless-stopped
    environment:
      - ST_DOCKER_MEMBER_LIST=seatunnel_master:5801,seatunnel_worker_1:5801,seatunnel_worker_2:5801
    entrypoint: >
      /bin/sh -c "
      /opt/seatunnel/bin/seatunnel-cluster.sh -r master
      "
    ports:
      - "5801:5801"
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/127.0.0.1/5801'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - seatunnel_network

  worker1:
    image: apache/seatunnel:2.3.13
    container_name: seatunnel_worker_1
    restart: unless-stopped
    environment:
      - ST_DOCKER_MEMBER_LIST=seatunnel_master:5801,seatunnel_worker_1:5801,seatunnel_worker_2:5801
    entrypoint: >
      /bin/sh -c "
      /opt/seatunnel/bin/seatunnel-cluster.sh -r worker
      "
    depends_on:
      master:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/127.0.0.1/5801'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - seatunnel_network

  worker2:
    image: apache/seatunnel:2.3.13
    container_name: seatunnel_worker_2
    restart: unless-stopped
    environment:
      - ST_DOCKER_MEMBER_LIST=seatunnel_master:5801,seatunnel_worker_1:5801,seatunnel_worker_2:5801
    entrypoint: >
      /bin/sh -c "
      /opt/seatunnel/bin/seatunnel-cluster.sh -r worker
      "
    depends_on:
      master:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/127.0.0.1/5801'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - seatunnel_network

  client:
    image: apache/seatunnel:2.3.13
    container_name: seatunnel_client
    restart: unless-stopped
    environment:
      - ST_DOCKER_MEMBER_LIST=seatunnel_master:5801
    entrypoint: >
      /bin/sh -c "
      exec tail -f /dev/null
      "
    volumes:
      - ./system:/opt/seatunnel/system
      - ./jobs:/opt/seatunnel/jobs
    depends_on:
      master:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/seatunnel_master/5801'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - seatunnel_network

volumes:
  data:

networks:
  seatunnel_network:
    name: seatunnel-network
    driver: bridge
